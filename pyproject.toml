[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wreckommend"
version = "0.1.0"
description = "A local music recommender system for Navidrome servers using Last.fm."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "add-a-charan" }]
dependencies = [
  "python-dotenv>=1.2.2",
  "requests>=2.34.2",
  "scikit-learn>=1.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/wreckommend"]
